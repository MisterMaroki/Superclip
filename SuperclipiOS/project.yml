# Superclip for iPhone. Generate the Xcode project with:  xcodegen generate
name: SuperclipiOS
options:
  bundleIdPrefix: com.omarmaroki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settingGroups:
  common:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: S34Q66469Q
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: 1
targets:
  SuperclipiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # The sync layer is shared with the Mac app, which compiles the same files
      - path: ../Superclip/Sync
        group: Shared Sync
    dependencies:
      - target: SuperclipShare
    entitlements:
      path: SuperclipiOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.omarmaroki.Superclip
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.omarmaroki.Superclip
        aps-environment: development
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarmaroki.Superclip.ios
        PRODUCT_NAME: Superclip
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Superclip
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Lets iCloud wake the app quietly when something changed on the Mac
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
  SuperclipShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Sources/Shared
      - Sources/Design
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Superclip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
    entitlements:
      path: ShareExtension/SuperclipShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.omarmaroki.Superclip
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarmaroki.Superclip.ios.share
        PRODUCT_NAME: SuperclipShare
